# Messungen für das Analyse-Tool (`uv run python -m analysis <id>`).
# Pfade in `files` sind relativ zu diesem Ordner. Ein Eintrag = eine Messung.
# Mehrere Mono-Dateien werden in der angegebenen Reihenfolge zu Kanälen zusammengesetzt,
# eine Mehrkanal-Datei liefert ihre Kanäle direkt.
#
# Felder: id, date, device, test, gain, usb, patch, title, files, note (optional), channel_labels (optional)

